components:
  schemas:
    CustomerTypeEnum:
      enum:
      - registrado
      - visitante
      type: string
      description: |-
        * `registrado` - Cliente registrado
        * `visitante` - Visitante
    Game:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          title: Título
          maxLength: 120
        genre:
          type: string
          title: Género
          maxLength: 60
        platform:
          type: string
          title: Plataforma
          maxLength: 60
        launch_year:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
          title: Año de lanzamiento
        synopsis:
          type: string
          title: Sinopsis
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,0})?$
          title: Precio
        stock:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        cover:
          type: string
          format: uri
          nullable: true
          title: Portada
        technical_sheet:
          type: string
          format: uri
          nullable: true
          title: Ficha técnica
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - genre
      - id
      - launch_year
      - platform
      - synopsis
      - title
    GamerProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        nickname:
          type: string
          maxLength: 40
        favorite_genre:
          type: string
          maxLength: 60
        avatar:
          type: string
          format: uri
          nullable: true
      required:
      - id
      - nickname
      - username
    Order:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          nullable: true
        customer_name:
          type: string
          title: Nombre completo
          maxLength: 120
        customer_rut:
          type: string
          title: RUT
          maxLength: 20
        customer_email:
          type: string
          format: email
          title: Correo electrónico
          maxLength: 150
        customer_phone:
          type: string
          title: Teléfono
          maxLength: 30
        shipping_address:
          type: string
          title: Dirección de despacho
          maxLength: 250
        customer_type:
          allOf:
          - $ref: '#/components/schemas/CustomerTypeEnum'
          title: Tipo de cliente
        created_at:
          type: string
          format: date-time
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          title: Estado
        payment_method:
          allOf:
          - $ref: '#/components/schemas/PaymentMethodEnum'
          title: Método de pago
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
          readOnly: true
        discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
          readOnly: true
          title: Descuento
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
      required:
      - created_at
      - discount
      - id
      - items
      - payment_method
      - subtotal
      - total
    OrderItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        game:
          type: integer
        game_title:
          type: string
          readOnly: true
        quantity:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,0})?$
          readOnly: true
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
          readOnly: true
      required:
      - game
      - game_title
      - id
      - quantity
      - subtotal
      - unit_price
    PatchedGame:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          title: Título
          maxLength: 120
        genre:
          type: string
          title: Género
          maxLength: 60
        platform:
          type: string
          title: Plataforma
          maxLength: 60
        launch_year:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
          title: Año de lanzamiento
        synopsis:
          type: string
          title: Sinopsis
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,0})?$
          title: Precio
        stock:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        cover:
          type: string
          format: uri
          nullable: true
          title: Portada
        technical_sheet:
          type: string
          format: uri
          nullable: true
          title: Ficha técnica
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedGamerProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        nickname:
          type: string
          maxLength: 40
        favorite_genre:
          type: string
          maxLength: 60
        avatar:
          type: string
          format: uri
          nullable: true
    PatchedOrder:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          nullable: true
        customer_name:
          type: string
          title: Nombre completo
          maxLength: 120
        customer_rut:
          type: string
          title: RUT
          maxLength: 20
        customer_email:
          type: string
          format: email
          title: Correo electrónico
          maxLength: 150
        customer_phone:
          type: string
          title: Teléfono
          maxLength: 30
        shipping_address:
          type: string
          title: Dirección de despacho
          maxLength: 250
        customer_type:
          allOf:
          - $ref: '#/components/schemas/CustomerTypeEnum'
          title: Tipo de cliente
        created_at:
          type: string
          format: date-time
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          title: Estado
        payment_method:
          allOf:
          - $ref: '#/components/schemas/PaymentMethodEnum'
          title: Método de pago
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
          readOnly: true
        discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
          readOnly: true
          title: Descuento
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
    PaymentMethodEnum:
      enum:
      - tarjeta
      - webpay
      type: string
      description: |-
        * `tarjeta` - Tarjeta de crédito o débito
        * `webpay` - Webpay
    StatusEnum:
      enum:
      - pendiente
      - pagada
      - cancelada
      type: string
      description: |-
        * `pendiente` - Pendiente
        * `pagada` - Pagada
        * `cancelada` - Cancelada
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
